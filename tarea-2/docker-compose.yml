services:
  cassandra1:
    image: cassandra:5.0
    container_name: cassandra1
    ports:
      - "9042:9042"

    # Incluye JVM, memoria nativa y cqlsh ejecutado dentro del contenedor.
    mem_limit: 2g

    environment:
      CASSANDRA_CLUSTER_NAME: "MyCluster"
      CASSANDRA_NUM_TOKENS: 64

      CASSANDRA_SEEDS: "cassandra1,cassandra2,cassandra3"
      CASSANDRA_LISTEN_ADDRESS: "cassandra1"
      CASSANDRA_BROADCAST_ADDRESS: "cassandra1"
      CASSANDRA_RPC_ADDRESS: "0.0.0.0"

      # Limitar memoria de la JVM
      MAX_HEAP_SIZE: "512M"
      MAX_DIRECT_MEMORY_SIZE: "256M"

    networks:
      cassandra_net:
        ipv4_address: 172.19.0.2
        aliases:
          - cassandra1


  cassandra2:
    image: cassandra:5.0
    container_name: cassandra2
    ports:
      - "9043:9042"

    mem_limit: 2g

    environment:
      CASSANDRA_CLUSTER_NAME: "MyCluster"
      CASSANDRA_NUM_TOKENS: 64

      CASSANDRA_SEEDS: "cassandra1,cassandra2,cassandra3"
      CASSANDRA_LISTEN_ADDRESS: "cassandra2"
      CASSANDRA_BROADCAST_ADDRESS: "cassandra2"
      CASSANDRA_RPC_ADDRESS: "0.0.0.0"

      MAX_HEAP_SIZE: "512M"
      MAX_DIRECT_MEMORY_SIZE: "256M"

    networks:
      cassandra_net:
        ipv4_address: 172.19.0.4
        aliases:
          - cassandra2


  cassandra3:
    image: cassandra:5.0
    container_name: cassandra3
    ports:
      - "9044:9042"

    mem_limit: 2g

    environment:
      CASSANDRA_CLUSTER_NAME: "MyCluster"
      CASSANDRA_NUM_TOKENS: 64

      CASSANDRA_SEEDS: "cassandra1,cassandra2,cassandra3"
      CASSANDRA_LISTEN_ADDRESS: "cassandra3"
      CASSANDRA_BROADCAST_ADDRESS: "cassandra3"
      CASSANDRA_RPC_ADDRESS: "0.0.0.0"

      MAX_HEAP_SIZE: "512M"
      MAX_DIRECT_MEMORY_SIZE: "256M"

    networks:
      cassandra_net:
        ipv4_address: 172.19.0.3
        aliases:
          - cassandra3


networks:
  cassandra_net:
    driver: bridge
    # Direcciones estables para que stop/start no intercambie identidades de nodos.
    ipam:
      config:
        - subnet: 172.19.0.0/24
